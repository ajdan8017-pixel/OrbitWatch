<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgLh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="12" fill="url(#bgLh)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <rect width="1000" height="44" rx="12" fill="#1e293b" />
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />
  <text x="500" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Chrome DevTools — Lighthouse Audit Report (OrbitWatch v1.0)</text>

  <!-- Lighthouse Score Gauges -->
  <g transform="translate(100, 80)">
    <!-- Score 1: Performance 96 -->
    <g transform="translate(0, 0)">
      <circle cx="70" cy="70" r="54" fill="none" stroke="#1e293b" stroke-width="10" />
      <circle cx="70" cy="70" r="54" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="13.5" stroke-linecap="round" transform="rotate(-90 70 70)" />
      <text x="70" y="78" fill="#10b981" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">96</text>
      <text x="70" y="150" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Performance</text>
    </g>

    <!-- Score 2: Accessibility 98 -->
    <g transform="translate(220, 0)">
      <circle cx="70" cy="70" r="54" fill="none" stroke="#1e293b" stroke-width="10" />
      <circle cx="70" cy="70" r="54" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="6.7" stroke-linecap="round" transform="rotate(-90 70 70)" />
      <text x="70" y="78" fill="#10b981" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">98</text>
      <text x="70" y="150" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Accessibility</text>
    </g>

    <!-- Score 3: Best Practices 100 -->
    <g transform="translate(440, 0)">
      <circle cx="70" cy="70" r="54" fill="none" stroke="#1e293b" stroke-width="10" />
      <circle cx="70" cy="70" r="54" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 70 70)" />
      <text x="70" y="78" fill="#10b981" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">100</text>
      <text x="70" y="150" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Best Practices</text>
    </g>

    <!-- Score 4: SEO 100 -->
    <g transform="translate(660, 0)">
      <circle cx="70" cy="70" r="54" fill="none" stroke="#1e293b" stroke-width="10" />
      <circle cx="70" cy="70" r="54" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 70 70)" />
      <text x="70" y="78" fill="#10b981" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">100</text>
      <text x="70" y="150" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">SEO</text>
    </g>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="840" height="280" rx="8" fill="#111827" stroke="#1f2937" />

    <!-- Metric 1 -->
    <g transform="translate(40, 40)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="30" y="14" fill="#9ca3af" font-family="sans-serif" font-size="13">First Contentful Paint (FCP)</text>
      <text x="30" y="42" fill="#10b981" font-family="monospace" font-size="24" font-weight="bold">0.8 s</text>
      <text x="30" y="62" fill="#6b7280" font-family="sans-serif" font-size="11">Target: &lt; 1.8 s</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(440, 40)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="30" y="14" fill="#9ca3af" font-family="sans-serif" font-size="13">Largest Contentful Paint (LCP)</text>
      <text x="30" y="42" fill="#10b981" font-family="monospace" font-size="24" font-weight="bold">1.3 s</text>
      <text x="30" y="62" fill="#6b7280" font-family="sans-serif" font-size="11">Target: &lt; 2.5 s</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(40, 150)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="30" y="14" fill="#9ca3af" font-family="sans-serif" font-size="13">Total Blocking Time (TBT)</text>
      <text x="30" y="42" fill="#10b981" font-family="monospace" font-size="24" font-weight="bold">20 ms</text>
      <text x="30" y="62" fill="#6b7280" font-family="sans-serif" font-size="11">Target: &lt; 200 ms</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(440, 150)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="30" y="14" fill="#9ca3af" font-family="sans-serif" font-size="13">Cumulative Layout Shift (CLS)</text>
      <text x="30" y="42" fill="#10b981" font-family="monospace" font-size="24" font-weight="bold">0.001</text>
      <text x="30" y="62" fill="#6b7280" font-family="sans-serif" font-size="11">Target: &lt; 0.1</text>
    </g>
  </g>
</svg>
