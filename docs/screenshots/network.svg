<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="12" fill="url(#bgNet)" stroke="#1e293b" stroke-width="2" />

  <!-- Window Header -->
  <rect width="1000" height="44" rx="12" fill="#1e293b" />
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />
  <text x="500" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Chrome DevTools — Network Waterfall &amp; Bundle Size Analysis</text>

  <!-- Filter Bar -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="940" height="34" rx="4" fill="#1e293b" />
    <text x="15" y="22" fill="#94a3b8" font-family="sans-serif" font-size="12">Filter: All | Fetch/XHR | JS | CSS | Img | Media | Font | Doc | WS</text>
    <text x="750" y="22" fill="#38bdf8" font-family="monospace" font-size="12">Disable cache: [✓]  No throttling</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(30, 105)">
    <rect x="0" y="0" width="940" height="30" fill="#334155" />
    <text x="15" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Name</text>
    <text x="320" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Status</text>
    <text x="400" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Type</text>
    <text x="480" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Initiator</text>
    <text x="570" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Size (gzip)</text>
    <text x="680" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Time</text>
    <text x="780" y="20" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Waterfall</text>
  </g>

  <!-- Rows -->
  <g transform="translate(30, 138)">
    <!-- Row 1: index.html -->
    <rect x="0" y="0" width="940" height="36" fill="#1e293b" opacity="0.4" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="12">/ (index.html)</text>
    <text x="320" y="22" fill="#10b981" font-family="monospace" font-size="12">200 OK</text>
    <text x="400" y="22" fill="#94a3b8" font-family="monospace" font-size="12">document</text>
    <text x="480" y="22" fill="#64748b" font-family="monospace" font-size="12">other</text>
    <text x="570" y="22" fill="#f8fafc" font-family="monospace" font-size="12">0.73 kB</text>
    <text x="680" y="22" fill="#10b981" font-family="monospace" font-size="12">24 ms</text>
    <rect x="780" y="10" width="40" height="14" rx="3" fill="#38bdf8" />

    <!-- Row 2: index.css -->
    <rect x="0" y="38" width="940" height="36" fill="#1e293b" opacity="0.6" />
    <text x="15" y="60" fill="#38bdf8" font-family="monospace" font-size="12">index-BFT6_EXL.css</text>
    <text x="320" y="60" fill="#10b981" font-family="monospace" font-size="12">200 OK</text>
    <text x="400" y="60" fill="#94a3b8" font-family="monospace" font-size="12">stylesheet</text>
    <text x="480" y="60" fill="#64748b" font-family="monospace" font-size="12">index.html</text>
    <text x="570" y="60" fill="#f8fafc" font-family="monospace" font-size="12">7.66 kB</text>
    <text x="680" y="60" fill="#10b981" font-family="monospace" font-size="12">45 ms</text>
    <rect x="800" y="48" width="55" height="14" rx="3" fill="#818cf8" />

    <!-- Row 3: index.js (Bundle) -->
    <rect x="0" y="76" width="940" height="36" fill="#1e293b" opacity="0.4" />
    <text x="15" y="98" fill="#38bdf8" font-family="monospace" font-size="12">index-CWM044St.js</text>
    <text x="320" y="98" fill="#10b981" font-family="monospace" font-size="12">200 OK</text>
    <text x="400" y="98" fill="#94a3b8" font-family="monospace" font-size="12">script</text>
    <text x="480" y="98" fill="#64748b" font-family="monospace" font-size="12">index.html</text>
    <text x="570" y="98" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">369.66 kB</text>
    <text x="680" y="98" fill="#10b981" font-family="monospace" font-size="12">142 ms</text>
    <rect x="815" y="86" width="110" height="14" rx="3" fill="#f59e0b" />

    <!-- Row 4: TLE Stations API -->
    <rect x="0" y="114" width="940" height="36" fill="#1e293b" opacity="0.6" />
    <text x="15" y="136" fill="#38bdf8" font-family="monospace" font-size="12">/api/tle/stations</text>
    <text x="320" y="136" fill="#10b981" font-family="monospace" font-size="12">200 OK</text>
    <text x="400" y="136" fill="#94a3b8" font-family="monospace" font-size="12">fetch</text>
    <text x="480" y="136" fill="#64748b" font-family="monospace" font-size="12">tleService.ts</text>
    <text x="570" y="136" fill="#f8fafc" font-family="monospace" font-size="12">4.2 kB</text>
    <text x="680" y="136" fill="#10b981" font-family="monospace" font-size="12">85 ms</text>
    <rect x="860" y="124" width="60" height="14" rx="3" fill="#10b981" />

    <!-- Row 5: Earth textures (procedural canvas) -->
    <rect x="0" y="152" width="940" height="36" fill="#1e293b" opacity="0.4" />
    <text x="15" y="174" fill="#38bdf8" font-family="monospace" font-size="12">earthDayTexture (canvas)</text>
    <text x="320" y="174" fill="#10b981" font-family="monospace" font-size="12">memory</text>
    <text x="400" y="174" fill="#94a3b8" font-family="monospace" font-size="12">image/png</text>
    <text x="480" y="174" fill="#64748b" font-family="monospace" font-size="12">earthTextures</text>
    <text x="570" y="174" fill="#f8fafc" font-family="monospace" font-size="12">0 B (memory)</text>
    <text x="680" y="174" fill="#10b981" font-family="monospace" font-size="12">12 ms</text>
    <rect x="830" y="162" width="30" height="14" rx="3" fill="#06b6d4" />
  </g>

  <!-- Summary Footer -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="940" height="85" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="25" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13">14 requests</text>
    <text x="140" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">377.3 kB transferred</text>
    <text x="320" y="32" fill="#94a3b8" font-family="sans-serif" font-size="13">1.36 MB resources</text>
    <text x="520" y="32" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">DOMContentLoaded: 420 ms</text>
    <text x="740" y="32" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">Load: 1.28 s</text>

    <!-- Target Comparison Badge -->
    <rect x="25" y="48" width="890" height="24" rx="4" fill="#064e3b" />
    <text x="470" y="65" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ✓ Метрика пройдена: Размер бандла 377 kB (цель &lt; 500 KB) | Время полной загрузки 1.28 с (цель &lt; 2.0 с)
    </text>
  </g>
</svg>
